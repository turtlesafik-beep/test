services:
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: test-app:latest
    container_name: test-app
    restart: unless-stopped
    environment:
      DB_PORT: ${DB_PORT}
      DB_HOST: ${DB_HOST}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - db-net
      - edge-net

  nginx-edge:
    image: nginx:alpine
    container_name: test-nginx-edge
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/edge/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - edge-net

  nginx-static:
    image: nginx:alpine
    container_name: test-nginx-static
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./nginx/static/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    networks:
      - edge-net

  db:
    image: postgres:17-alpine
    container_name: test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:

networks:
  db-net:
      driver: bridge
  edge-net:
      driver: bridge
